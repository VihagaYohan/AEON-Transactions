version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      expo:
        patterns:
          - expo
          - expo-*
          - '@expo/*'
          - react-native
          - react-native-*

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
